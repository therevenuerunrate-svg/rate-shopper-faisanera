<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Shopper Faisanera Golf | The Revenue Run Rate</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#222D63;
    --navy-dark:#1A2050;
    --azul-medio:#5762A5;
    --naranja:#E8533A;
    --salmon:#E7895E;
    --blanco:#FFFFFF;
    --gris-label:#8090B0;
    --verde-neon:#00FF88;
    --card-bg:#2A3570;
    --card-border:#3A4580;
    --gris-oscuro:#595959;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:var(--blanco);
    min-height:100vh;
  }
  .bg-lines{
    position:fixed; top:0; right:0; width:420px; height:420px; z-index:0;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 14px);
    pointer-events:none;
  }
  header{
    position:relative; z-index:1;
    padding:28px 32px 18px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .eyebrow{ color:var(--salmon); font-size:13px; letter-spacing:0.06em; text-transform:uppercase; font-weight:bold;}
  .brand h1{ margin:0; font-size:26px; font-weight:bold; }
  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select, button.adhoc-btn{
    background:var(--card-bg); color:var(--blanco); border:1px solid var(--card-border);
    border-radius:8px; padding:9px 12px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  select:focus, button:focus{ outline:2px solid var(--verde-neon); outline-offset:2px; }

  nav.tabs{
    position:relative; z-index:1;
    display:flex; gap:6px; padding:14px 32px 0; flex-wrap:wrap;
  }
  nav.tabs button{
    background:transparent; border:none; color:var(--gris-label);
    font-family:inherit; font-size:14px; font-weight:bold; padding:10px 16px;
    border-radius:8px 8px 0 0; cursor:pointer; border-bottom:3px solid transparent;
  }
  nav.tabs button.active{ color:var(--blanco); border-bottom:3px solid var(--naranja); background:rgba(255,255,255,0.04); }
  nav.tabs button:hover{ color:var(--blanco); }

  main{ position:relative; z-index:1; padding:24px 32px 60px; }
  .view{ display:none; animation:fadeIn 0.25s ease; }
  .view.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  h2.headline{ font-size:22px; margin:0 0 4px; }
  p.sub{ color:var(--gris-label); font-size:13px; margin:0 0 20px; max-width:720px; line-height:1.5;}

  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:24px; }
  .card{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px;
    padding:18px 20px;
  }
  .card .label{ color:var(--gris-label); font-size:12px; letter-spacing:0.03em; text-transform:uppercase; }
  .card .big{ font-size:34px; font-weight:bold; margin:6px 0 4px; }
  .card .note{ font-size:12px; color:var(--gris-label); line-height:1.4; }
  .pos{ color:var(--verde-neon); }
  .neg{ color:var(--naranja); }
  .neutral{ color:var(--blanco); }

  .semaforo{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .sem-verde{ background:var(--verde-neon); }
  .sem-ambar{ background:#FFD166; }
  .sem-rojo{ background:var(--naranja); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--gris-label); font-weight:normal; padding:8px 10px; border-bottom:1px solid var(--card-border); font-size:12px; text-transform:uppercase; letter-spacing:0.03em;}
  td{ padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.05); }
  tr:hover td{ background:rgba(255,255,255,0.03); }

  .chart-wrap{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:20px; margin-bottom:20px; height:360px; }

  .heatmap{ overflow-x:auto; }
  .heatmap table{ min-width:900px; }
  .hcell{ width:26px; height:26px; border-radius:5px; text-align:center; font-size:10px; }
  .hcell.disp{ background:rgba(0,255,136,0.18); color:var(--verde-neon); }
  .hcell.no-disp{ background:rgba(232,83,58,0.28); color:var(--naranja); }
  .hcell.na{ background:rgba(255,255,255,0.03); color:var(--gris-label); }

  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:bold; }
  .pill-propio{ background:rgba(0,255,136,0.15); color:var(--verde-neon); }
  .pill-marca{ background:rgba(231,137,94,0.2); color:var(--salmon); }
  .pill-comp{ background:rgba(87,98,165,0.35); color:var(--blanco); }

  .loading, .error{ padding:60px 20px; text-align:center; color:var(--gris-label); }
  .error{ color:var(--naranja); }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }

  footer{ position:relative; z-index:1; padding:20px 32px; color:var(--gris-oscuro); font-size:11px; border-top:1px solid rgba(255,255,255,0.06); }

  @media (max-width:640px){
    header{ padding:20px 18px 14px; }
    main{ padding:18px 18px 50px; }
    nav.tabs{ padding:14px 18px 0; overflow-x:auto; flex-wrap:nowrap; }
  }
</style>
</head>
<body>
<div class="bg-lines"></div>

<header>
  <div class="brand">
    <span class="eyebrow">The Revenue Run Rate · Rate Shopper</span>
    <h1 id="mainTitle">Faisanera Golf — Posicionamiento de Precio vs Compset</h1>
  </div>
  <div class="controls">
    <select id="ventanaSelect">
      <option value="rolling">Ventana actual (3 meses)</option>
      <option value="adhoc">Ad-Hoc — otra fecha</option>
    </select>
    <input type="month" id="adhocMonth" style="display:none; background:var(--card-bg); color:#fff; border:1px solid var(--card-border); border-radius:8px; padding:8px;">
    <button class="adhoc-btn" id="refreshBtn" title="Recargar datos (bypassa cache)">↻ Actualizar</button>
    <span id="filtroActivoBadge" style="display:none; background:rgba(0,255,136,0.15); color:var(--verde-neon); padding:8px 12px; border-radius:8px; font-size:12px; font-weight:bold;"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="indice">Índice de Precio</button>
  <button class="tab-btn" data-view="temporal">Evolución Temporal</button>
  <button class="tab-btn" data-view="disponibilidad">Mapa de Disponibilidad</button>
  <button class="tab-btn" data-view="detalle">Detalle de Canal</button>
  <button class="tab-btn" data-view="calendario">Calendario</button>
</nav>

<main id="mainContent">
  <div class="loading" id="loadingMsg">Cargando datos del rate shopper…</div>
</main>

<footer>
  The Revenue Run Rate · Rate Shopper Faisanera Golf · Datos generados: <span id="generadoEl">—</span>
</footer>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbzqoe1N84YUK5BcS1idrWJ0RL8lE0dREusTpY1AWJKa4KRYh07dxkjvp9jaDjurI8yn/exec";

const CATEGORIA_COLORS = {
  'Propio': 'pill-propio',
  'Marca Propia / Sinergia': 'pill-marca',
};

let RAW = { booking: [], webDirecta: [], fechasCentinela: [] };
let RAW_SIN_FILTRAR = { booking: [], webDirecta: [], fechasCentinela: [] };
let CALENDARIO_EVENTOS = []; // no se filtra por ventana, siempre disponible completo
let ALL_PRICE_RECORDS = []; // booking + webDirecta merged, con Canal etiquetado
let mesFiltro = null; // null = ventana actual (sin filtro), o nombre de mes en español para Ad-Hoc

const MESES_ES_JS = ['enero','febrero','marzo','abril','mayo','junio','julio',
                      'agosto','septiembre','octubre','noviembre','diciembre'];

function capitalizar(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function aplicarFiltroVentana(){
  function filtrar(arr){
    if(!mesFiltro) return arr;
    return arr.filter(r => r.Mes_Objetivo === mesFiltro);
  }
  RAW.booking = filtrar(RAW_SIN_FILTRAR.booking);
  RAW.webDirecta = filtrar(RAW_SIN_FILTRAR.webDirecta);
  RAW.fechasCentinela = filtrar(RAW_SIN_FILTRAR.fechasCentinela);
  ALL_PRICE_RECORDS = [
    ...RAW.booking.map(r => ({...r, Canal: 'Booking.com'})),
    ...RAW.webDirecta.map(r => ({...r, Canal: 'Web Directa'})),
  ];
  const badge = document.getElementById('filtroActivoBadge');
  if(badge){
    if(mesFiltro){
      badge.style.display = 'inline-block';
      badge.textContent = '📌 Filtro Ad-Hoc: ' + mesFiltro + ' (' + ALL_PRICE_RECORDS.length + ' registros)';
    } else {
      badge.style.display = 'none';
    }
  }
}

function parseDDMMYYYY(str){
  if(!str) return null;
  const parts = str.split('/');
  if(parts.length !== 3) return null;
  return new Date(Date.UTC(parseInt(parts[2],10), parseInt(parts[1],10)-1, parseInt(parts[0],10), 12,0,0));
}

const UMBRAL_ANOMALIA_PCT = 25; // % de desviacion sobre la media para marcar anomalia

/**
 * Busca si una Fecha_Estancia (string DD/MM/AAAA) cae dentro de algun
 * rango de CALENDARIO_EVENTOS. Devuelve el nombre del evento (o varios
 * unidos con " / ") o null si no coincide con nada conocido.
 */
function buscarEventoParaFecha(fechaStr){
  const fecha = parseDDMMYYYY(fechaStr);
  if(!fecha || CALENDARIO_EVENTOS.length === 0) return null;
  const coincidencias = CALENDARIO_EVENTOS.filter(e => {
    const inicio = parseDDMMYYYY(e.Fecha_Inicio);
    const fin = parseDDMMYYYY(e.Fecha_Fin);
    if(!inicio || !fin) return false;
    return fecha >= inicio && fecha <= fin;
  });
  if(coincidencias.length === 0) return null;
  return coincidencias.map(e => e.Evento).join(' / ');
}

/**
 * Detecta anomalias de precio dentro de un conjunto de registros.
 * Calcula la media por Entidad + Canal + Es_FinDeSemana (para no comparar
 * un dia laborable con un fin de semana), y marca cualquier registro que
 * se desvie mas de UMBRAL_ANOMALIA_PCT % de esa media. Cada anomalia
 * incluye el contexto de calendario si coincide con un evento conocido.
 */
function detectarAnomalias(records){
  const grupos = {};
  records.forEach(r => {
    if(r.Precio_BAR == null) return;
    const key = r.Entidad + '|' + r.Canal + '|' + r.Es_FinDeSemana;
    if(!grupos[key]) grupos[key] = [];
    grupos[key].push(Number(r.Precio_BAR));
  });
  const medias = {};
  Object.keys(grupos).forEach(key => {
    const vals = grupos[key];
    medias[key] = vals.reduce((s,v)=>s+v,0) / vals.length;
  });

  const anomalias = [];
  records.forEach(r => {
    if(r.Precio_BAR == null) return;
    const key = r.Entidad + '|' + r.Canal + '|' + r.Es_FinDeSemana;
    const media = medias[key];
    if(!media || grupos[key].length < 3) return; // muestra minima para que la media sea fiable
    const precio = Number(r.Precio_BAR);
    const desviacionPct = ((precio - media) / media) * 100;
    if(Math.abs(desviacionPct) >= UMBRAL_ANOMALIA_PCT){
      anomalias.push({
        entidad: r.Entidad, canal: r.Canal, fecha: r.Fecha_Estancia,
        diaSemana: r.Dia_Semana, precio, media, desviacionPct,
        contexto: buscarEventoParaFecha(r.Fecha_Estancia),
      });
    }
  });
  anomalias.sort((a,b) => Math.abs(b.desviacionPct) - Math.abs(a.desviacionPct));
  return anomalias;
}

function fmtDate(d){
  if(!d) return '—';
  return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
}

async function loadData(bypassCache){
  const loading = document.getElementById('loadingMsg');
  loading.style.display = 'block';
  loading.textContent = 'Cargando datos del rate shopper…';
  loading.className = 'loading';
  try{
    const url = PROXY_URL + (bypassCache ? '?nocache=1' : '');
    const res = await fetch(url);
    if(!res.ok) throw new Error('Respuesta no valida del proxy: ' + res.status);
    const data = await res.json();
    RAW_SIN_FILTRAR.booking = data.booking || [];
    RAW_SIN_FILTRAR.webDirecta = data.webDirecta || [];
    RAW_SIN_FILTRAR.fechasCentinela = data.fechasCentinela || [];
    CALENDARIO_EVENTOS = data.calendarioEventos || [];
    aplicarFiltroVentana();

    document.getElementById('generadoEl').textContent = data.generadoEl
      ? new Date(data.generadoEl).toLocaleString('es-ES') : '—';

    loading.style.display = 'none';
    renderActiveView();
  }catch(err){
    loading.className = 'error';
    loading.textContent = 'No se pudieron cargar los datos: ' + err.message + '. Verifica que el Apps Script este desplegado y accesible.';
  }
}

// ---------- Vista 1: Indice de Precio ----------
function buildPanelAnomalias(records){
  const anomalias = detectarAnomalias(records);
  if(anomalias.length === 0){
    return `<div class="card" style="margin-bottom:24px;">
      <div class="label">⚠️ Anomalías de precio</div>
      <div class="note">Sin anomalías detectadas todavía (o histórico insuficiente para calcular una media fiable por entidad/canal/tipo de día).</div>
    </div>`;
  }
  let filas = '';
  anomalias.slice(0,15).forEach(a => {
    const cls = a.desviacionPct > 0 ? 'neg' : 'pos';
    const contextoHtml = a.contexto
      ? `<span class="pos">✓ ${a.contexto}</span>`
      : `<span style="color:var(--gris-label);">Sin evento conocido</span>`;
    filas += `<tr>
      <td>${a.entidad}</td><td>${a.canal}</td><td>${a.fecha} (${a.diaSemana||''})</td>
      <td>${a.precio.toFixed(2)} €</td><td>${a.media.toFixed(2)} €</td>
      <td class="${cls}">${a.desviacionPct>0?'+':''}${a.desviacionPct.toFixed(0)}%</td>
      <td>${contextoHtml}</td>
    </tr>`;
  });
  return `<div class="card" style="margin-bottom:24px;">
    <div class="label">⚠️ Anomalías de precio detectadas (±${UMBRAL_ANOMALIA_PCT}% vs media histórica del mismo tipo de día)</div>
    <table style="margin-top:10px;">
      <thead><tr><th>Entidad</th><th>Canal</th><th>Fecha</th><th>Precio</th><th>Media esperada</th><th>Desviación</th><th>Contexto</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
  </div>`;
}

function renderIndice(container){
  if(ALL_PRICE_RECORDS.length === 0){
    container.innerHTML = '<p class="sub">Sin datos todavia. Cuando tengas shops reales cargados, aqui vera el indice de precio.</p>';
    return;
  }
  const maxFecha = ALL_PRICE_RECORDS.reduce((max, r) => {
    const d = parseDDMMYYYY(r.Fecha_Consulta);
    return (!max || (d && d > max)) ? d : max;
  }, null);
  const maxFechaStr = maxFecha ? maxFecha.toISOString().slice(0,10) : null;

  const ultimos = ALL_PRICE_RECORDS.filter(r => {
    const d = parseDDMMYYYY(r.Fecha_Consulta);
    return d && maxFecha && d.toISOString().slice(0,10) === maxFechaStr;
  });

  function buildCanalCard(canal){
    const enCanal = ultimos.filter(r => r.Canal === canal && r.Precio_BAR != null);
    const propio = enCanal.filter(r => r.Categoria === 'Propio');
    const mercado = enCanal.filter(r => r.Categoria !== 'Propio' && r.Categoria !== 'Marca Propia / Sinergia');

    if(propio.length === 0 || mercado.length === 0){
      return `<div class="card"><div class="label">${canal}</div><div class="big neutral">Sin datos suficientes</div><div class="note">Faltan precios propios o del comp-set en el ultimo shop para este canal.</div></div>`;
    }
    const avgPropio = propio.reduce((s,r)=>s+Number(r.Precio_BAR),0) / propio.length;
    const avgMercado = mercado.reduce((s,r)=>s+Number(r.Precio_BAR),0) / mercado.length;
    const indice = (avgPropio / avgMercado) * 100;
    let semClass = 'sem-ambar', cls='neutral';
    if(indice > 108){ semClass='sem-rojo'; cls='neg'; }
    else if(indice < 92){ semClass='sem-verde'; cls='pos'; }
    return `<div class="card">
      <div class="label"><span class="semaforo ${semClass}"></span>${canal} — Índice vs comp-set</div>
      <div class="big ${cls}">${indice.toFixed(0)}</div>
      <div class="note">Tu precio medio ${avgPropio.toFixed(2)}€ vs mercado ${avgMercado.toFixed(2)}€. 100 = paridad exacta.</div>
    </div>`;
  }

  function buildLaFarmCard(){
    const laFarm = ultimos.filter(r => r.Entidad && r.Entidad.toLowerCase().includes('farm') && r.Precio_BAR != null);
    const propio = ultimos.filter(r => r.Categoria === 'Propio' && r.Precio_BAR != null);
    if(laFarm.length===0 || propio.length===0){
      return `<div class="card"><div class="label">Faisanera vs La Farm (sinergia de marca)</div><div class="big neutral">Sin datos</div></div>`;
    }
    const avgFarm = laFarm.reduce((s,r)=>s+Number(r.Precio_BAR),0)/laFarm.length;
    const avgPropio = propio.reduce((s,r)=>s+Number(r.Precio_BAR),0)/propio.length;
    const diff = ((avgPropio-avgFarm)/avgFarm*100);
    return `<div class="card">
      <div class="label">Faisanera vs La Farm (sinergia de marca)</div>
      <div class="big ${diff>=0?'pos':'neg'}">${diff>=0?'+':''}${diff.toFixed(0)}%</div>
      <div class="note">Faisanera ${avgPropio.toFixed(2)}€ vs La Farm ${avgFarm.toFixed(2)}€. No entra en la media de mercado.</div>
    </div>`;
  }

  // Gap de paridad Booking vs Web Directa (mismas entidades, ambos canales)
  function buildGapParidad(){
    const entidades = [...new Set(ultimos.map(r=>r.Entidad))];
    let rows = '';
    entidades.forEach(ent => {
      const bk = ultimos.find(r => r.Entidad===ent && r.Canal==='Booking.com' && r.Precio_BAR!=null);
      const wd = ultimos.find(r => r.Entidad===ent && r.Canal==='Web Directa' && r.Precio_BAR!=null);
      if(bk && wd){
        const gap = ((Number(bk.Precio_BAR) - Number(wd.Precio_BAR)) / Number(wd.Precio_BAR) * 100);
        const alerta = gap < -3 ? '<span class="semaforo sem-rojo"></span>Booking mas barato' : gap > 3 ? '<span class="semaforo sem-verde"></span>Web directa mas barata' : '<span class="semaforo sem-ambar"></span>Paridad';
        rows += `<tr><td>${ent}</td><td>${Number(bk.Precio_BAR).toFixed(2)} €</td><td>${Number(wd.Precio_BAR).toFixed(2)} €</td><td>${gap.toFixed(1)}%</td><td>${alerta}</td></tr>`;
      }
    });
    if(!rows) return '<p class="sub">Aun no hay entidades con datos de ambos canales en el ultimo shop.</p>';
    return `<table><thead><tr><th>Entidad</th><th>Booking</th><th>Web Directa</th><th>Gap</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  container.innerHTML = `
    <h2 class="headline">Posicionamiento de Precio vs Compset</h2>
    <p class="sub">Comparativa del último shop (${maxFecha?fmtDate(maxFecha):'—'}) entre Faisanera Golf y el comp-set, por canal. Recuerda: el BAR no distingue régimen entre canales — trata el gap como indicativo y confírmalo en la vista de Detalle de Canal si te llama la atención.</p>
    ${buildPanelAnomalias(ALL_PRICE_RECORDS)}
    <div class="grid">
      ${buildCanalCard('Booking.com')}
      ${buildCanalCard('Web Directa')}
      ${buildLaFarmCard()}
    </div>
    <h2 class="headline" style="font-size:18px;">Paridad Booking vs Web Directa</h2>
    <p class="sub">Mismo día, misma entidad, comparado entre canales — así detectas fugas de paridad.</p>
    ${buildGapParidad()}
  `;
}

// ---------- Vista 2: Curva de precio por fecha de estancia (shot seleccionado) ----------
let temporalChart = null;
function renderTemporal(container){
  const entidades = [...new Set(ALL_PRICE_RECORDS.map(r=>r.Entidad))].filter(Boolean);
  if(entidades.length === 0){
    container.innerHTML = '<p class="sub">Sin datos todavia.</p>';
    return;
  }
  container.innerHTML = `
    <h2 class="headline">Curva de precio por fecha de estancia</h2>
    <p class="sub">Precio BAR de cada día del mes, para el shot (fecha de consulta) que selecciones. Cuando acumules varios shots en fechas distintas, podrás comparar la curva de hoy contra la de shots anteriores para ver la evolución real en el tiempo — con un único shot, verás solo la curva de ese día.</p>
    <div class="filters">
      <select id="entidadSelect"></select>
      <select id="canalSelect">
        <option value="Booking.com">Booking.com</option>
        <option value="Web Directa">Web Directa</option>
      </select>
      <select id="consultaSelect"></select>
    </div>
    <div class="chart-wrap"><canvas id="temporalCanvas"></canvas></div>
  `;
  const entSelect = document.getElementById('entidadSelect');
  entidades.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e; opt.textContent = e;
    entSelect.appendChild(opt);
  });

  function poblarFechasConsulta(){
    const ent = entSelect.value;
    const canal = document.getElementById('canalSelect').value;
    const fechas = [...new Set(
      ALL_PRICE_RECORDS
        .filter(r => r.Entidad === ent && r.Canal === canal && r.Fecha_Consulta)
        .map(r => r.Fecha_Consulta)
    )];
    fechas.sort((a,b) => parseDDMMYYYY(b) - parseDDMMYYYY(a)); // mas reciente primero
    const consultaSelect = document.getElementById('consultaSelect');
    consultaSelect.innerHTML = '';
    fechas.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f; opt.textContent = 'Shot del ' + f;
      consultaSelect.appendChild(opt);
    });
  }

  function draw(){
    const ent = entSelect.value;
    const canal = document.getElementById('canalSelect').value;
    const fechaConsulta = document.getElementById('consultaSelect').value;

    // Reconstruye el contenedor del grafico desde cero cada vez, para que
    // nunca quede "roto" si una combinacion anterior no tenia datos y
    // sustituyo el <canvas> por un mensaje.
    const chartWrap = document.querySelector('.chart-wrap');
    chartWrap.innerHTML = '<canvas id="temporalCanvas"></canvas>';

    const pts = ALL_PRICE_RECORDS
      .filter(r => r.Entidad === ent && r.Canal === canal && r.Fecha_Consulta === fechaConsulta && r.Precio_BAR != null)
      .map(r => ({ fecha: parseDDMMYYYY(r.Fecha_Estancia), precio: Number(r.Precio_BAR) }))
      .filter(p => p.fecha)
      .sort((a,b) => a.fecha - b.fecha);

    if(pts.length === 0){
      chartWrap.innerHTML = '<p class="sub" style="padding-top:20px;">No hay datos para esta combinación todavía.</p>';
      return;
    }

    const labels = pts.map(p => fmtDate(p.fecha));
    const valores = pts.map(p => p.precio);

    const ctx = document.getElementById('temporalCanvas').getContext('2d');
    if(temporalChart) temporalChart.destroy();

    temporalChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: ent + ' (' + canal + ') — shot del ' + fechaConsulta,
          data: valores,
          borderColor: '#00FF88',
          backgroundColor: 'rgba(0,255,136,0.1)',
          tension: 0.25,
          pointRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { title:{display:true, text:'Fecha de estancia', color:'#8090B0'}, ticks:{color:'#8090B0'}, grid:{color:'rgba(255,255,255,0.05)'} },
          y: { ticks:{color:'#8090B0', callback:v=>v+' €'}, grid:{color:'rgba(255,255,255,0.05)'} }
        },
        plugins: { legend:{ labels:{ color:'#FFFFFF' } } }
      }
    });
  }

  entSelect.addEventListener('change', () => { poblarFechasConsulta(); draw(); });
  document.getElementById('canalSelect').addEventListener('change', () => { poblarFechasConsulta(); draw(); });
  document.getElementById('consultaSelect').addEventListener('change', draw);

  poblarFechasConsulta();
  draw();
}

// ---------- Vista 3: Mapa de Disponibilidad ----------
function renderDisponibilidad(container){
  const meses = [...new Set(ALL_PRICE_RECORDS.map(r=>r.Mes_Objetivo))].filter(Boolean);
  if(meses.length === 0){
    container.innerHTML = '<p class="sub">Sin datos todavia.</p>';
    return;
  }
  container.innerHTML = `
    <h2 class="headline">Mapa de disponibilidad</h2>
    <p class="sub">Verde = disponible, naranja = sin disponibilidad. Arriba, el sistema detecta automáticamente precios que se desvían mucho de lo habitual para esa entidad y tipo de día (entre semana/fin de semana) — señal de eventos de demanda que no tienes mapeados.</p>
    <div class="filters">
      <select id="mesSelect"></select>
      <select id="canalDispSelect">
        <option value="Booking.com">Booking.com</option>
        <option value="Web Directa">Web Directa</option>
      </select>
    </div>
    <div id="anomaliasWrap"></div>
    <div class="heatmap" id="heatmapWrap"></div>
  `;
  const mesSelect = document.getElementById('mesSelect');
  meses.forEach(m => {
    const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
    mesSelect.appendChild(opt);
  });

  function drawAnomalias(filtrados){
    const anomalias = detectarAnomalias(filtrados);
    const wrap = document.getElementById('anomaliasWrap');
    if(anomalias.length === 0){
      wrap.innerHTML = '<p class="sub" style="margin-bottom:16px;">Sin anomalías detectadas en este mes/canal (desviación &lt; ' + UMBRAL_ANOMALIA_PCT + '% sobre la media por tipo de día).</p>';
      return;
    }
    let html = '<div class="card" style="margin-bottom:20px; border-color:#E8533A;"><div class="label" style="color:var(--naranja);">⚠ Anomalías detectadas (' + anomalias.length + ')</div>';
    html += '<table style="margin-top:10px;"><thead><tr><th>Entidad</th><th>Fecha</th><th>Día</th><th>Precio</th><th>Media esperada</th><th>Desviación</th><th>Contexto</th></tr></thead><tbody>';
    anomalias.slice(0,10).forEach(a => {
      const cls = a.desviacionPct > 0 ? 'neg' : 'pos';
      const contextoHtml = a.contexto
        ? `<span class="pos">✓ ${a.contexto}</span>`
        : `<span style="color:var(--gris-label);">Sin evento conocido</span>`;
      html += `<tr><td>${a.entidad}</td><td>${a.fecha}</td><td>${a.diaSemana||''}</td><td>${a.precio.toFixed(2)} €</td><td>${a.media.toFixed(2)} €</td><td class="${cls}">${a.desviacionPct>0?'+':''}${a.desviacionPct.toFixed(0)}%</td><td>${contextoHtml}</td></tr>`;
    });
    html += '</tbody></table></div>';
    wrap.innerHTML = html;
  }

  function draw(){
    const mes = mesSelect.value;
    const canal = document.getElementById('canalDispSelect').value;
    const filtrados = ALL_PRICE_RECORDS.filter(r => r.Mes_Objetivo === mes && r.Canal === canal);
    const entidades = [...new Set(filtrados.map(r=>r.Entidad))].filter(Boolean);

    drawAnomalias(filtrados);
    // ultima fecha de consulta por entidad+dia para no duplicar si hay varios shops del mismo mes
    const porEntidadDia = {};
    filtrados.forEach(r => {
      const d = parseDDMMYYYY(r.Fecha_Estancia);
      if(!d) return;
      const dia = d.getUTCDate();
      const key = r.Entidad + '|' + dia;
      const fc = parseDDMMYYYY(r.Fecha_Consulta);
      if(!porEntidadDia[key] || (fc && fc > porEntidadDia[key].fc)){
        porEntidadDia[key] = { soldOut: r.Sold_Out, fc };
      }
    });

    let html = '<table><thead><tr><th>Entidad</th>';
    for(let d=1; d<=31; d++) html += `<th>${d}</th>`;
    html += '</tr></thead><tbody>';
    entidades.forEach(ent => {
      html += `<tr><td>${ent}</td>`;
      for(let d=1; d<=31; d++){
        const rec = porEntidadDia[ent+'|'+d];
        if(!rec) html += '<td><div class="hcell na">–</div></td>';
        else if(rec.soldOut === 'Si') html += '<td><div class="hcell no-disp">✕</div></td>';
        else html += '<td><div class="hcell disp">✓</div></td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('heatmapWrap').innerHTML = html;
  }
  mesSelect.addEventListener('change', draw);
  document.getElementById('canalDispSelect').addEventListener('change', draw);
  draw();
}

// ---------- Vista 4: Detalle de Canal (fechas centinela) ----------
function renderDetalle(container){
  if(RAW.fechasCentinela.length === 0){
    container.innerHTML = '<p class="sub">Sin datos de fechas centinela todavia.</p>';
    return;
  }
  const entidades = [...new Set(RAW.fechasCentinela.map(r=>r.Entidad))].filter(Boolean);
  container.innerHTML = `
    <h2 class="headline">Detalle por canal — fechas centinela</h2>
    <p class="sub">Genius, Escapada, Preferente y Móvil (Booking) — Club/Rewards, Última Hora y No Reembolsable (Web Directa). Solo disponible en las fechas que se han capturado con detalle.</p>
    <div class="filters"><select id="entDetSelect"><option value="">Todas las entidades</option></select></div>
    <div id="detalleTableWrap"></div>
  `;
  const sel = document.getElementById('entDetSelect');
  entidades.forEach(e => { const o=document.createElement('option'); o.value=e; o.textContent=e; sel.appendChild(o); });

  function pillFor(cat){
    return CATEGORIA_COLORS[cat] || 'pill-comp';
  }

  function draw(){
    const filtro = sel.value;
    const rows = RAW.fechasCentinela.filter(r => !filtro || r.Entidad === filtro);
    let html = `<table><thead><tr>
      <th>Entidad</th><th>Fecha estancia</th><th>Día</th><th>Canal</th><th>Tipología</th><th>Régimen</th>
      <th>Precio público</th><th>Precio c/dto</th><th>Tipo dto</th><th>Sold Out</th><th>Nota</th>
    </tr></thead><tbody>`;
    rows.forEach(r => {
      html += `<tr>
        <td><span class="pill ${pillFor(r.Categoria)}">${r.Entidad||''}</span></td>
        <td>${r.Fecha_Estancia||''}</td>
        <td>${r.Es_FinDeSemana==='Si' ? '<span class="pill pill-marca">'+(r.Dia_Semana||'')+'</span>' : (r.Dia_Semana||'')}</td>
        <td>${r.Canal||''}</td>
        <td>${r.Tipo_Habitacion||''}</td>
        <td>${r.Regimen||''}</td>
        <td>${r.Precio_Publico!=null?Number(r.Precio_Publico).toFixed(2)+' €':'—'}</td>
        <td>${r.Precio_Con_Descuento!=null?Number(r.Precio_Con_Descuento).toFixed(2)+' €':(r.Precio_Genius!=null?Number(r.Precio_Genius).toFixed(2)+' €':'—')}</td>
        <td>${r.Tipo_Descuento_Web||(r.Descuento_Genius_percent||'')||'—'}</td>
        <td>${r.Sold_Out||''}</td>
        <td style="max-width:260px; font-size:11px; color:var(--gris-label);">${r.Nota_Evento||''}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('detalleTableWrap').innerHTML = html;
  }
  sel.addEventListener('change', draw);
  draw();
}

// ---------- Vista 5: Calendario de Eventos ----------
function renderCalendario(container){
  if(CALENDARIO_EVENTOS.length === 0){
    container.innerHTML = '<p class="sub">Sin calendario de eventos cargado todavía — añade filas en la pestaña Calendario_Eventos del Sheet.</p>';
    return;
  }

  const hoy = new Date();
  const hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const finVentana = new Date(hoySinHora);
  finVentana.setDate(finVentana.getDate() + 90); // misma logica que la ventana rodante de 3 meses

  const eventos = CALENDARIO_EVENTOS
    .map(e => ({...e, fechaObj: parseDDMMYYYY(e.Fecha_Inicio)}))
    .filter(e => e.fechaObj)
    .sort((a,b) => a.fechaObj - b.fechaObj);

  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio',
                 'Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  let filasHtml = '';
  let mesActual = null;
  eventos.forEach(e => {
    const mesEvento = meses[e.fechaObj.getUTCMonth()] + ' ' + e.fechaObj.getUTCFullYear();
    if(mesEvento !== mesActual){
      mesActual = mesEvento;
      filasHtml += `<tr><td colspan="3" style="background:var(--azul-medio); color:#fff; font-weight:bold; padding:8px 10px;">${mesActual}</td></tr>`;
    }
    const enVentana = e.fechaObj >= hoySinHora && e.fechaObj <= finVentana;
    const rango = e.Fecha_Inicio === e.Fecha_Fin ? e.Fecha_Inicio : `${e.Fecha_Inicio} — ${e.Fecha_Fin}`;
    filasHtml += `<tr>
      <td>${rango}</td>
      <td>${e.Evento}</td>
      <td>${enVentana ? '<span class="pill pill-propio">● En ventana activa</span>' : ''}</td>
    </tr>`;
  });

  container.innerHTML = `
    <h2 class="headline">Calendario de Eventos</h2>
    <p class="sub">Eventos conocidos de Faisanera Golf / La Granja, usados automáticamente para dar contexto a las anomalías de precio detectadas. "En ventana activa" = cae dentro de los próximos 90 días desde hoy.</p>
    <table>
      <thead><tr><th>Fecha</th><th>Evento</th><th>Estado</th></tr></thead>
      <tbody>${filasHtml}</tbody>
    </table>
  `;
}

// ---------- Router de vistas ----------
const RENDERERS = {
  indice: renderIndice,
  temporal: renderTemporal,
  disponibilidad: renderDisponibilidad,
  detalle: renderDetalle,
  calendario: renderCalendario,
};
let currentView = 'indice';

function renderActiveView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="view active" id="viewContainer"></div>`;
  RENDERERS[currentView](document.getElementById('viewContainer'));
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    renderActiveView();
  });
});

document.getElementById('ventanaSelect').addEventListener('change', (e) => {
  const esAdhoc = e.target.value === 'adhoc';
  document.getElementById('adhocMonth').style.display = esAdhoc ? 'inline-block' : 'none';
  if(!esAdhoc){
    mesFiltro = null;
    aplicarFiltroVentana();
    renderActiveView();
  } else {
    // Al pasar a Ad-Hoc, si ya hay un mes elegido en el campo, aplicalo ya
    const val = document.getElementById('adhocMonth').value;
    if(val){
      const [anio, mesNum] = val.split('-');
      mesFiltro = capitalizar(MESES_ES_JS[parseInt(mesNum,10)-1]);
      aplicarFiltroVentana();
      renderActiveView();
    }
  }
});

document.getElementById('adhocMonth').addEventListener('change', (e) => {
  if(document.getElementById('ventanaSelect').value !== 'adhoc') return;
  const val = e.target.value; // formato "AAAA-MM"
  if(!val) return;
  const [anio, mesNum] = val.split('-');
  mesFiltro = capitalizar(MESES_ES_JS[parseInt(mesNum,10)-1]);
  aplicarFiltroVentana();
  renderActiveView();
});

document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));

loadData(false);
</script>
